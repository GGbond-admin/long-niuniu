<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>至尊牛牛</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #boot-fallback {
        display: none;
        margin: 48px 24px;
        color: #f5f5f4;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback">页面加载失败，请升级 Telegram 或系统 WebView 后重试。</div>
    <script>
      // 启动脚本抛错时给出可读提示，避免旧机白屏/无限转圈
      window.addEventListener('error', function (event) {
        if (document.getElementById('root') && !document.getElementById('root').childNodes.length) {
          var el = document.getElementById('boot-fallback');
          if (el) {
            el.style.display = 'block';
            if (event && event.message) el.textContent = '页面加载失败：' + event.message;
          }
        }
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.childNodes.length) {
          var el = document.getElementById('boot-fallback');
          if (el) el.style.display = 'block';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
